  - title: Professional Experience
    type: experience
    items:
      - organization: TikTok
        unit: AI Innovation Center, Singapore
        date: May 2026 – Present
        details:
          - Staff Research Scientist (Soaring Star Program)
          - "<strong>Recursive Self-Improvement:</strong> Develop systems that optimize the runtime performance of large-scale production codebases via a <em>reliable feedback</em> loop: execution-guided self-play measuring every candidate optimization."
          - "<strong>Benchmark Reconstruction:</strong> Beyond replaying live traffic in sandboxes, synthesize offline microbenchmarks that match production profiles, yielding faithful performance signals for fast rollouts."
          - "<strong>Correctness-First Verification:</strong> Candidates must pass all correctness checks before efficiency is scored, preventing reward hacking via shortcut solutions. Deployed to production services at TikTok, contributing to cumulative CPU capacity savings of 1M+ CPU cores in half a year."
      - organization: National University of Singapore
        unit: Institute of Data Science
        date: Aug. 2021 – May 2026
        details:
          - "Research Associate (Advisor: <em>Prof. See-Kiong Ng</em>)"
          - "<strong>Benchmarks &amp; Evaluation:</strong> Established an independent research agenda on the efficiency of LLM-generated code: built benchmarks from function to repository level (<em>Mercury</em>, <em>EffiBench-X</em>, <em>PortBench</em>, <em>SWE-Perf</em>, <em>CodeArena</em>)."
          - "<strong>Code Self-Evolution:</strong> Designed reinforcement learning methods to drive code-model self-evolution (<em>Afterburner</em>, <em>Mastermind</em>), and trained execution-free reward models to remove the RL rollout bottleneck (<em>CodeScaler</em>)."
          - "<strong>Test Generation:</strong> Led a software-testing research line on the robust evaluation of generated code, spanning mutation analysis for CPU and GPU programs and compact, high-quality test generation (<em>ULT</em>, <em>Nexus</em>, ICSE’25)."
          - "<strong>Industry Collaboration:</strong> Affiliated with the Cisco–NUS Accelerated Digital Economy Corporate Laboratory, translating research into internal Cisco products; funded by Cisco, Google, NVIDIA and Thinking Machines Lab."
      - organization: ByteDance
        unit: TikTok Search, Beijing
        date: Dec. 2019 – Aug. 2021
        details:
          - Software Architect (Search Engine)
          - "<strong>Final-Stage Search Engine:</strong> Architected <em>Search Eternal</em>, a general-purpose, large-scale distributed engine that to this day serves all final-stage ranking traffic across ByteDance, including <em>Douyin</em>, <em>TikTok</em> and <em>Toutiao</em>."
          - "<strong>Distributed Systems &amp; NLP for Search:</strong> Designed its distributed serving architecture for high-throughput, low-latency retrieval and ranking, and applied NLP to search for query understanding and relevance."

